[package]
name = "keeper"
version = "2.0.0-dev.1"
edition = "2024"
description = "An inspectable, content-addressed integrity catalog for ordinary files"
publish = false

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
